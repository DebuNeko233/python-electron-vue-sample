[project]
name = "sample-backend"
version = "0.1.0"
description = "A small, independent FastAPI backend for the Electron starter."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "loguru>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
