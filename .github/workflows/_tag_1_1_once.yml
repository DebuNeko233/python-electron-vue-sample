name: Create release tag 1.1 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tag_1_1_once.yml'

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the already verified main commit
        shell: bash
        run: |
          set -euo pipefail
          target='620481679e25b46d7365760c7e34b9c3f8d074e8'
          git cat-file -e "$target^{commit}"
          if git ls-remote --exit-code --tags origin refs/tags/1.1 >/dev/null 2>&1; then
            echo 'Tag 1.1 already exists; refusing to move it'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 1.1 "$target" -m "Release 1.1"
          git push origin refs/tags/1.1
          echo "Created 1.1 at $target"
