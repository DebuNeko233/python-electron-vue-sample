name: Refresh TestClient dependency (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_refresh_httpx2_once.yml'
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Replace deprecated test-only client and update lock
        run: |
          set -euo pipefail
          uv remove --project backend --dev httpx
          uv add --project backend --dev 'httpx2>=2.14,<2.15'
          uv sync --project backend --locked --group dev
          uv run --project backend --group dev pytest -q -W 'error::starlette.exceptions.StarletteDeprecationWarning'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/pyproject.toml backend/uv.lock
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix(test): use httpx2 for Starlette TestClient'
          git push origin HEAD:main
