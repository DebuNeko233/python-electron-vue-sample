name: Create requested 1.0.0 tag (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tag_1_0_0_once.yml'

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the exact previously tested commit
        env:
          TARGET_SHA: '1eb9eb835a2d7fca0a32145b97740c351688157c'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin 'refs/tags/1.0.0' >/dev/null 2>&1; then
            echo "Tag 1.0.0 already exists; refusing to overwrite"
            exit 1
          fi
          git cat-file -e "${TARGET_SHA}^{commit}"
          git tag 1.0.0 "$TARGET_SHA"
          git push origin 'refs/tags/1.0.0'
