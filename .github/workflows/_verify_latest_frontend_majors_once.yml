name: Verify latest stable frontend majors (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_verify_latest_frontend_majors_once.yml'

permissions:
  contents: write

jobs:
  upgrade-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test latest stable major versions rather than guessing compatibility
        shell: bash
        run: |
          set -euo pipefail
          pnpm up --latest
          pnpm list --depth 0
      - name: Validate Vue, TypeScript, Electron and scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec electron-vite build
          node --test scripts/docs.test.mjs
          node --test scripts/process-command.test.mjs
          node --test scripts/windows-terminal.test.mjs
      - name: Verify bundled Python and Electron lifecycle
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          node scripts/smoke-backend.mjs
          node scripts/smoke-electron.mjs
          node scripts/smoke-parent-exit.mjs
      - name: Commit newest compatible stable majors only after smoke tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No newer stable versions'
            exit 0
          fi
          git commit -m 'chore(deps): adopt latest stable frontend majors verified on Windows'
          git push origin HEAD:main
